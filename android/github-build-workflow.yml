# Builds the Android app (APK) on GitHub's computers - nothing to install on your PC.
# Run it from the "Actions" tab ("Build Android app" -> "Run workflow"), or it runs after each upload.
# The APK files appear under the finished run, in "Artifacts".
name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "js/**"
      - "css/**"
      - "icons/**"
      - "index.html"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ListeningLearner-android-apk
          path: android/app/build/outputs/apk/release/*.apk
